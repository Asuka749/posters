<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- 这一行非常重要：让手机按设备宽度来排版 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 16px;
      margin: 0;
    }

    /* 统一内容宽度 */
    .container {
      width: 100%;
      max-width: 540px;       /* 和海报最大宽度一致 */
      margin: 0 auto 16px;    /* 居中 + 控制上下间距 */
    }

    /* 海报图片 */
    .poster {
      width: 100%;
      height: auto;
      border: 2px solid white;
      border-radius: 8px;
      display: block;
    }

    /* 视频容器：保持 16:9 比例，自适应缩放 */
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 比例，高度=宽度*9/16 */
      height: 0;
      overflow: hidden;
      border-radius: 8px;
      border: 2px solid white;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <!-- 海报 -->
  <div class="container">
    <img class="poster"
         src="https://raw.githubusercontent.com/Asuka749/posters/main/dream-MisterEofImaginationEdgarAllanPoe/17.png

"
         alt="Poster Image">
  </div>

  <!-- YouTube 视频 -->
  <div class="container">
    <div class="video-wrapper">
      <iframe 
        src="https://www.youtube.com/watch?v=I3I6TMY6Cvo"
        title="YouTube video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>
  </div>

</body>

</html>
