<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- 这一行非常重要：让手机按设备宽度来排版 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 16px;
      margin: 0;
    }

    /* 统一内容宽度 */
    .container {
      width: 100%;
      max-width: 540px;       /* 和海报最大宽度一致 */
      margin: 0 auto 16px;    /* 居中 + 控制上下间距 */
    }

    /* 海报图片 */
    .poster {
      width: 100%;
      height: auto;
      border: 2px solid white;
      border-radius: 8px;
      display: block;
    }

    /* YouTube 封面容器 */
    .video-cover {
      position: relative;
      display: block;
      cursor: pointer;
    }

    /* YouTube 封面图片 */
    .video-thumb {
      width: 100%;
      height: auto;
      border-radius: 8px;
      border: 2px solid white;
      display: block;
    }

    /* 播放按钮（居中） */
    .video-cover::after {
      content: "▶";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 60px;
      color: white;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- 海报 -->
  <div class="container">
    <img class="poster"
         src="https://raw.githubusercontent.com/Asuka749/posters/main/hope-CalendarGirlstheMusical/8.png"
         alt="Poster Image">
  </div>

  <!-- YouTube 封面（点击跳转播放） -->
  <div class="container">
    <a href="https://www.youtube.com/watch?v=A9vswFNEEZE" target="_blank" class="video-cover">
      <img class="video-thumb"
           src="https://img.youtube.com/vi/A9vswFNEEZE/hqdefault.jpg"
           alt="YouTube Video">
    </a>
  </div>

</body>
</html>
