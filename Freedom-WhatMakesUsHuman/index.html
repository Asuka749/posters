<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 16px;
      margin: 0;
    }


    .container {
      width: 100%;
      max-width: 540px;
      margin: 0 auto 16px;
    }

    /* 图片样式 */
    .poster {
      width: 100%;
      height: auto;
      border: 2px solid white;
      border-radius: 8px;
      display: block;
    }


    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 8px;
      border: 2px solid white;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>


  <div class="container">
    <img class="poster"
         src="https://raw.githubusercontent.com/Asuka749/posters/main/Freedom-WhatMakesUsHuman/Susie%20Alegre.png"
         alt="Poster Image">
  </div>


  <div class="container">
    <div class="video-wrapper">
      <iframe
        src="https://www.edbookfest.co.uk/the-festival/whats-on/susie-alegre-shami-chakrabarti-what-makes-us-human"
        allowfullscreen>
      </iframe>
    </div>
  </div>

</body>
</html>
