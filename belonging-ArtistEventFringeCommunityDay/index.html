<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- 让手机按设备宽度排版 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 16px;
      margin: 0;
    }

    /* 统一内容宽度（海报 + 视频封面） */
    .container {
      width: 100%;
      max-width: 540px;
      margin: 0 auto 20px;
    }

    /* 海报 / 视频封面样式 */
    .poster,
    .video-thumb {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
    }

    /* 视频封面加个边框，和之前风格一致 */
    .video-thumb {
      border: 2px solid white;
    }
  </style>
</head>
<body>

  <!-- 海报 -->
  <div class="container">
    <img class="poster"
         src="https://raw.githubusercontent.com/Asuka749/posters/main/belonging-ArtistEventFringeCommunityDay/Artist%20Event.png"
         alt="Poster Image">
  </div>

  <!-- 视频封面（自动获取 YouTube 封面，点击跳转） -->
  <div class="container">
    <a href="https://youtu.be/zGTTv3e04Go" target="_blank">
      <img class="video-thumb"
           src="https://img.youtube.com/vi/zGTTv3e04Go/maxresdefault.jpg"
           alt="YouTube Video Cover">
    </a>
  </div>

</body>
</html>
