<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 16px;
      margin: 0;
    }


    .container {
      width: 100%;
      max-width: 540px;       
      margin: 0 auto 16px;    
    }


    .poster {
      width: 100%;
      height: auto;
      border: 2px solid white;
      border-radius: 8px;
      display: block;
    }


    .video-cover {
      position: relative;
      display: block;
    }


    .video-thumb {
      width: 100%;
      height: auto;
      border: 2px solid white;
      border-radius: 8px;
      display: block;
    }


    .video-cover::after {
      content: "▶";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 60px;
      color: white;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
      pointer-events: none;
    }
  </style>
</head>
<body>


  <div class="container">
    <img class="poster"
         src="https://raw.githubusercontent.com/Asuka749/posters/main/anger-ABriefHistoryofDifference/15.png"
         alt="Poster Image">
  </div>


  <div class="container">
    <a href="https://www.youtube.com/watch?v=aPxvRl05Q1I" target="_blank" class="video-cover">
      <img class="video-thumb"
           src="https://img.youtube.com/vi/aPxvRl05Q1I/hqdefault.jpg"
           alt="YouTube Video">
    </a>
  </div>

</body>
</html>
