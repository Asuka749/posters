<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 16px;
      margin: 0;
    }

    /* 内容容器 */
    .container {
      width: 100%;
      max-width: 540px;
      margin: 0 auto 20px;
    }

    /* 海报 / 视频封面 */
    .poster,
    .video-thumb {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
    }

    /* 视频封面加边框 */
    .video-thumb {
      border: 2px solid white;
    }
  </style>

</head>
<body>

  <!-- 海报 -->
  <div class="container">
    <img class="poster"
         src="https://raw.githubusercontent.com/Asuka749/posters/main/belonging-CommunityActionAgainstClimateChange/15.png"
         alt="Poster Image">
  </div>

  <!-- 视频封面（点击跳转到 YouTube） -->
  <div class="container">
    <a href="https://youtu.be/vsKOPtC6a0k" target="_blank">
      <img class="video-thumb"
           src="https://raw.githubusercontent.com/Asuka749/posters/main/belonging-CommunityActionAgainstClimateChange/15.png"
           alt="Video Cover">
    </a>
  </div>

</body>
</html>
