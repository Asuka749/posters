<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poster</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 540px;
      margin-bottom: 16px;
    }

    img {
      width: 100%;
      height: auto;
      display: block;
      border: 2px solid white;
      border-radius: 8px;
    }


    .video-cover {
      position: relative;
      display: block;
      cursor: pointer;
    }


    .video-cover::after {
      content: "▶";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 60px;
      color: white;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
      pointer-events: none;
    }
  </style>
</head>
<body>


  <div class="container">
    <img
      src="https://raw.githubusercontent.com/Asuka749/posters/main/hope-BernardineEvaristoOnNeverGivingUp/7.png"
      alt="Poster">
  </div>


  <div class="container">
    <a href="https://www.youtube.com/watch?v=FnmmUHl6jmg" target="_blank" class="video-cover">
      <img
        src="https://img.youtube.com/vi/FnmmUHl6jmg/hqdefault.jpg"
        alt="YouTube Cover">
    </a>
  </div>

</body>
</html>
