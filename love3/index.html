<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poster</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: white;
      text-align: center;
      font-family: Arial, sans-serif;
    }
    img {
      width: 100%;
      max-width: 540px; /* 在大屏居中限制宽度 */
      height: auto;
      display: block;
      margin: 0 auto;
      border-radius: 8px;
    }
    a {
      color: #87CEFA;         /* 亮蓝色，明显可点 */
      text-decoration: underline;
      word-break: break-all;  /* 让长网址能换行 */
    }
  </style>
</head>
<body>

  <!-- 海报图片 -->
  <img src="https://raw.githubusercontent.com/Asuka749/posters/main/love3/3.png"
       alt="poster">

  <!-- 可点击的网址 -->
  <p style="margin-top: 20px; font-size: 16px;">
    <a href="https://www.edfringe.com/tickets/whats-on/2025SPACEBE" target="_blank">
      https://www.edfringe.com/tickets/whats-on/2025SPACEBE
    </a>
  </p>

</body>
</html>
