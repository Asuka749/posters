<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- This line is essential: ensures layout adapts to mobile screen width -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 16px;
      margin: 0;
    }

    /* Unified content width */
    .container {
      width: 100%;
      max-width: 540px;       /* Same max width as poster */
      margin: 0 auto 16px;    /* Center + vertical spacing */
    }

    /* Poster image */
    .poster {
      width: 100%;
      height: auto;
      border: 2px solid white;
      border-radius: 8px;
      display: block;
    }

    /* Video container: keeps 16:9 aspect ratio, fully responsive */
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 aspect ratio */
      height: 0;
      overflow: hidden;
      border-radius: 8px;
      border: 2px solid white;
    }

    /* TikTok / iframe embed */
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <!-- Poster -->
  <div class="container">
    <img class="poster"
         src="https://raw.githubusercontent.com/Asuka749/posters/main/Freedom-Bedsheets/BEDSHEETS.png"
         alt="Poster Image">
  </div>

  <!-- TikTok Video -->
  <div class="container">
    <div class="video-wrapper">
      <iframe 
        src="https://www.tiktok.com/embed/7404549724415560993"
        allow="autoplay; encrypted-media"
        allowfullscreen>
      </iframe>
    </div>
  </div>

</body>
</html>
